name: Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell syntax
        shell: bash
        run: |
          bash -n tart.sh
          bash -n tests/run.sh

      - name: Run tests
        shell: bash
        run: ./tests/run.sh
