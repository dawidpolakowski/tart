name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to release, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-unix:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Check shell syntax
        shell: bash
        run: |
          bash -n tart.sh
          bash -n tart-desktop
          bash -n tests/run.sh
          bash -n scripts/install.sh
          bash -n scripts/install-macos.sh
          bash -n scripts/prepare-release.sh
          node --check scripts/generate-icons.mjs
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/renderer.cjs
          node --check desktop/tart-core.cjs
          node --check tests/test_desktop_core.mjs
          node --check tests/test_desktop_renderer.mjs

      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Run tests
        shell: bash
        run: npm test

      - name: Smoke test installer
        shell: bash
        run: |
          install_dir="$(mktemp -d)"
          TART_INSTALL_DIR="$install_dir" ./scripts/install.sh
          "$install_dir/tart" version

      - name: Smoke test release packager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          output_dir="$(mktemp -d)"
          ./scripts/prepare-release.sh v0.0.0-test "$output_dir"
          test -f "$output_dir/install.sh"
          test -f "$output_dir/install-macos.sh"
          test -f "$output_dir/install.ps1"
          test -f "$output_dir/tart.sh"
          test -f "$output_dir/tart-linux.tar.gz"
          test -f "$output_dir/tart-macos.tar.gz"
          test -f "$output_dir/tart-windows.zip"
          test -f "$output_dir/SHA256SUMS.txt"
          tar -tzf "$output_dir/tart-linux.tar.gz" | grep -q "/package.json"
          tar -tzf "$output_dir/tart-linux.tar.gz" | grep -q "/scripts/install-macos.sh"
          tar -tzf "$output_dir/tart-linux.tar.gz" | grep -q "/desktop/main.cjs"
          tar -tzf "$output_dir/tart-linux.tar.gz" | grep -q "/desktop/index.html"
          tar -tzf "$output_dir/tart-linux.tar.gz" | grep -q "/assets/tart-clock-icon.icns"
          tar -tzf "$output_dir/tart-linux.tar.gz" | grep -q "/assets/tart-clock-icon.ico"
          tar -tzf "$output_dir/tart-linux.tar.gz" | grep -q "/assets/tart-clock-icon.png"

  verify-windows:
    name: Verify (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install tart
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "tart-bin"
          ./scripts/install.ps1 -InstallDir $installDir -NoPathUpdate
          & (Join-Path $installDir "tart.cmd") version

  release:
    name: Build And Publish
    runs-on: ubuntu-latest
    needs:
      - verify-unix
      - verify-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            version="${{ inputs.tag }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        shell: bash
        run: |
          mkdir -p dist
          ./scripts/prepare-release.sh "${{ steps.version.outputs.value }}" dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ steps.version.outputs.value }}
          path: dist/*

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" dist/* --clobber
          else
            gh release create "$version" dist/* --title "$version" --generate-notes
          fi
